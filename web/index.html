<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No pinch-zoom: delune is laid out for the phone it's on, and a stray zoom leaves it off-centre. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>delune</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1226" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9ebf4" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Find music on Soulseek, check it, and add it to your Navidrome library." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="delune" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
