# delune next to an existing Navidrome. Copy .env.example to .env and fill it in.
services:
  delune:
    build: .
    # image: ghcr.io/pndaman/delune:latest   (published images arrive with v0.1)
    restart: unless-stopped
    env_file: .env
    environment:
      DELUNE_DATA_DIR: /data
      DELUNE_LIBRARY_DIR: /music
    ports:
      - "7474:7474"   # web UI and API; put a reverse proxy with HTTPS in front
      - "2234:2234"   # Soulseek, so peers can reach you
    volumes:
      - delune-data:/data
      # The same music folder Navidrome scans.
      - /path/to/music:/music

  # Through a VPN instead: uncomment gluetun, give delune `network_mode: service:gluetun`,
  # and move delune's `ports` onto gluetun. Soulseek traffic then only leaves through
  # the VPN, and stops if the VPN drops. Forward the Soulseek port with your provider.
  #
  # gluetun:
  #   image: qmcgaw/gluetun
  #   cap_add: [NET_ADMIN]
  #   devices: [/dev/net/tun]
  #   env_file: gluetun.env        # VPN_SERVICE_PROVIDER, keys, FIREWALL_VPN_INPUT_PORTS=2234
  #   ports:
  #     - "7474:7474"
  #     - "2234:2234"
  #   restart: unless-stopped

volumes:
  delune-data:
