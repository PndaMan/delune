name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: checkboxes
    id: rules
    attributes:
      label: Fits delune's rules
      options:
        - label: Keeps Soulseek first and streaming opt-in
        - label: Keeps review before import
