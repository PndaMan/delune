[package]
name = "delune-tui"
description = "Terminal UI client for delune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
serde_json = "1.0.151"
url = "2.5.8"
anyhow = "1.0.104"
crossterm = "0.29.0"
delune-core = { version = "0.1.0-dev", path = "../delune-core" }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
