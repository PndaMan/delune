[package]
name = "delune-core"
description = "Domain model for delune: releases, tracks, audio quality, providers and source policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
ts-rs = { version = "12", optional = true, features = ["serde-compat"] }

[dev-dependencies]
serde_json = "1.0.151"

[features]
# TypeScript declarations for the web UI: `cargo run -p delune-core --example typescript --features ts`.
ts = ["dep:ts-rs"]

[[example]]
name = "typescript"
required-features = ["ts"]
