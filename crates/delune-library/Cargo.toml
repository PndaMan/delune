[package]
name = "delune-library"
description = "Library layout, naming templates, tagging and import for delune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
delune-core = { version = "0.1.0-dev", path = "../delune-core" }
crc32fast = "1.5.2"
flate2 = "1.1.10"
lofty = "0.25.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "alac", "wav", "aiff", "ogg", "vorbis", "pcm"] }
thiserror = "2.0.20"
tracing = "0.1.44"
utoipa = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# OpenAPI schemas for the server's API description.
openapi = ["dep:utoipa"]
