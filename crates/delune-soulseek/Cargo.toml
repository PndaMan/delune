[package]
name = "delune-soulseek"
description = "Native Soulseek protocol client for delune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
delune-core = { version = "0.1.0-dev", path = "../delune-core" }
flate2 = "1.1.10"
md-5 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "io-util", "rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
