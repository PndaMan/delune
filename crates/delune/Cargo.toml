[package]
name = "delune"
description = "Soulseek-first music acquisition for Navidrome — server, TUI and web UI in one binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
delune-core = { version = "0.1.0-dev", path = "../delune-core" }
delune-library = { version = "0.1.0-dev", path = "../delune-library" }
delune-navidrome = { version = "0.1.0-dev", path = "../delune-navidrome" }
delune-server = { version = "0.1.0-dev", path = "../delune-server" }
delune-soulseek = { version = "0.1.0-dev", path = "../delune-soulseek" }
delune-tui = { version = "0.1.0-dev", path = "../delune-tui" }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
